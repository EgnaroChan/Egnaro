<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDPM论文解析</title>
  <style>
    body {
      margin: 0;
      background: #f4f7f6;
      color: #111;
      font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
      line-height: 1.65;
    }
    main {
      width: min(92%, 1100px);
      margin: 36px auto;
      padding: 42px 52px 56px;
      box-sizing: border-box;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }
    .back {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: .95rem;
      margin-bottom: 1.4rem;
    }
    a {
      color: #0645d8;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    #article h1 {
      margin: 0 0 28px;
      font-size: 2.25rem;
      letter-spacing: .02em;
      color: #111;
      font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
      font-weight: 700;
    }
    #article h2 {
      margin: 2.4rem 0 1rem;
      font-size: 1.65rem;
      color: #111;
      font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
    }
    #article h3 {
      margin: 1.8rem 0 .8rem;
      font-size: 1.28rem;
      color: #111;
      font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
    }
    #article h4, #article h5, #article h6 {
      color: #111;
      font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
    }
    #article p, #article li {
      font-size: 1.18rem;
      color: #111;
    }
    #article p { margin: 1.1rem 0; }
    #article span, #article strong, #article b, #article em {
      color: inherit;
    }
    #article ul, #article ol {
      padding-left: 2rem;
    }
    #article blockquote {
      margin: 1.3rem 0;
      padding-left: 1.2rem;
      border-left: 3px solid #ddd;
      color: #444;
    }
    #article mjx-container {
      color: #111 !important;
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
    }
    #article mjx-container[display="true"] {
      margin: 1.35rem 0 !important;
      padding: .35rem 0;
    }
    #article mjx-container svg {
      max-width: 100%;
    }
    #article script[type="math/tex"] {
      display: none !important;
    }
    #article table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.3rem 0;
    }
    #article th, #article td {
      border: 1px solid #ddd;
      padding: .55rem .7rem;
      color: #111;
    }
    #article pre, #article code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #article pre {
      overflow-x: auto;
      padding: 1rem;
      background: #f6f8fa;
      border-radius: 6px;
    }
    .loading, .error {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #555;
    }
    @media (max-width: 700px) {
      main {
        width: 96%;
        margin: 14px auto;
        padding: 24px 18px 36px;
      }
      #article h1 { font-size: 1.65rem; }
      #article h2 { font-size: 1.4rem; }
      #article p, #article li { font-size: 1.03rem; }
    }
  </style>
</head>
<body>
<main>
  <div class="back"><a href="index.html">← Back to home</a></div>
  <div id="article"><p class="loading">Loading...</p></div>
</main>
<script>
  fetch('DDPM论文解析.html')
    .then(response => {
      if (!response.ok) throw new Error('Failed to load article source.');
      return response.text();
    })
    .then(html => {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const source = doc.querySelector('#write');
      if (!source) throw new Error('Article body not found.');
      document.getElementById('article').innerHTML = source.innerHTML;
    })
    .catch(error => {
      document.getElementById('article').innerHTML =
        '<p class="error">The article could not be loaded. <a href="DDPM论文解析.html">Open the original page.</a></p>';
    });
</script>
</body>
</html>
